name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  integration-release:
    name: Integration tests (release gate)
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lavpop_chatbot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lavpop_chatbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full unit test suite (release gate)
        run: pytest -q

      - name: Run integration tests against PostgreSQL
        env:
          TEST_POSTGRES_DSN: dbname=lavpop_chatbot user=postgres password=postgres host=127.0.0.1 port=5432
        run: pytest -m integration -q

  deploy-release:
    name: Deploy release (blocked by integration gate)
    runs-on: ubuntu-latest
    needs:
      - tests
      - integration-release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: production
    env:
      APP_ENV: production
      APP_DEBUG_LOG_MODE: "false"
      META_VALIDATE_SIGNATURE: "true"
      META_REQUIRE_APP_SECRET: "true"
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
    steps:
      - name: Block deploy if security baseline is not strict
        run: |
          python - <<'PY'
          import os
          import sys

          errors = []
          app_env = (os.getenv("APP_ENV") or "").strip().lower()
          debug_log_mode = (os.getenv("APP_DEBUG_LOG_MODE") or "").strip().lower()
          validate = (os.getenv("META_VALIDATE_SIGNATURE") or "").strip().lower()
          require_secret = (os.getenv("META_REQUIRE_APP_SECRET") or "").strip().lower()
          app_secret = (os.getenv("META_APP_SECRET") or "").strip()

          if app_env not in {"prod", "production"}:
            errors.append("APP_ENV deve ser 'prod' ou 'production'.")
          if validate != "true":
            errors.append("META_VALIDATE_SIGNATURE deve ser 'true'.")
          if require_secret != "true":
            errors.append("META_REQUIRE_APP_SECRET deve ser 'true'.")
          if debug_log_mode != "false":
            errors.append("APP_DEBUG_LOG_MODE deve ser 'false'.")
          if not app_secret:
            errors.append("META_APP_SECRET precisa estar definido.")

          if errors:
            print("::error::Deploy bloqueado por baseline de segurança inválido:")
            for item in errors:
              print(f"::error::{item}")
            sys.exit(1)

          print("Baseline de segurança validado. Pode prosseguir com deploy.")
          PY

      - name: Deploy placeholder
        run: |
          echo "Gate de integração passou e baseline de segurança está estrito."
          echo "Substitua este passo pelo comando real de deploy."

      - name: Smoke test production
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          if [ -z "${PRODUCTION_BASE_URL}" ]; then
            echo "::warning::PRODUCTION_BASE_URL não configurado; smoke test pós-deploy ignorado."
            exit 0
          fi

          python scripts/production_smoke_test.py --base-url "${PRODUCTION_BASE_URL}"
