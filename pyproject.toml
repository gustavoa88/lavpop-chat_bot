[project]
name = "lavpop-chatbot"
version = "1.0.0"
description = "Chatbot WhatsApp Cloud API with FastAPI, PostgreSQL and OpenAI fallback."
requires-python = ">=3.11,<3.14"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
